services:
  - type: web
    name: python-backend-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: APP_NAME
        value: "Python Backend API"
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "false"
      - key: API_PREFIX
        value: "/api/v1"
    autoDeploy: true
    healthCheckPath: /api/v1/health
